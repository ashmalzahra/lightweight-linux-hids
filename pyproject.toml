[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight-linux-hids"
version = "0.1.0"
description = "A lightweight, configurable, rule-based HIDS research prototype for Linux"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Ashmal Zahra" }
]
dependencies = [
    "PyYAML>=6.0,<7.0",
    "psutil>=5.9,<8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0"
]

[project.scripts]
lightweight-hids = "lightweight_hids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"